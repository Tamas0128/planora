services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora
      POSTGRES_DB: planora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planora"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://planora:planora@postgres:5432/planora
      SECRET_KEY: change-me-in-production
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: planora-docs
      CORS_ORIGINS: http://localhost:3001,http://localhost:3000,http://localhost,http://localhost:8080,https://localhost:8443
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_FROM: noreply@planora.local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: planora
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora
      SCHEDULE: "30 0 * * *"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 12
      BACKUP_KEEP_MONTHS: 12
      BACKUP_DIR: /backups
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  minio-backup:
    build: ./infra/minio-backup
    environment:
      MC_HOST_URL: http://minio:9000
      MC_ACCESS_KEY: minioadmin
      MC_SECRET_KEY: minioadmin
      MC_BUCKET: planora-docs
    volumes:
      - minio_backups:/backups
    depends_on:
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3001:3000"

  nginx:
    build: ./infra/nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
      - "8443:443"

volumes:
  postgres_data:
  minio_data:
  postgres_backups:
  minio_backups:
