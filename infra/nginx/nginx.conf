events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 50M;

  # Plain HTTP and TLS both proxy to the same place. This is a single-host
  # local/dev setup (non-standard ports, self-signed cert) — there is no
  # public hostname to build a correct redirect Location against, so both
  # listeners are served directly rather than redirecting 80 -> 443.
  server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's embedded DNS (127.0.0.11) re-resolved every 10s via a
    # variable in proxy_pass, instead of nginx caching the frontend
    # container's IP for its own process lifetime — otherwise every
    # frontend rebuild/recreate (new container IP) leaves nginx serving
    # 502s against the old IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
