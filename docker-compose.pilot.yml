# Pilot-környezet port-felülírásai — a `docker-compose.yml` mellé adva
# indítja el, teljesen elkülönített volume-okkal/hálózattal (a projekt
# nevet a `-p planora-pilot` flag adja), így a fejlesztői stack adatait
# nem érinti.
#
# Indítás:
#   docker compose -p planora-pilot -f docker-compose.yml -f docker-compose.pilot.yml \
#     --env-file .env.pilot up -d --build postgres minio mailpit backend frontend nginx postgres-backup minio-backup
#
# A postgres-backup/minio-backup szolgáltatások naponta (00:30, ill. 01:00)
# mentik a Postgres adatbázist és a MinIO dokumentum-tárolót a
# planora-pilot_postgres_backups / planora-pilot_minio_backups volume-okba
# (indításkor azonnal is készül egy alap-mentés). Visszaállításhoz lásd:
# infra/restore.ps1. A https-local (Caddy) szolgáltatást a pilothoz
# szándékosan nem indítjuk el — nem kell egy demo/pilot környezethez.

services:
  backend:
    environment:
      PILOT_MODE: ${PILOT_MODE:-false}

  postgres:
    ports: !override
      - "5434:5432"

  minio:
    ports: !override
      - "9010:9000"

  mailpit:
    ports: !override
      - "8035:8025"

  frontend:
    ports: !override
      - "3002:3000"

  nginx:
    ports: !override
      - "8090:80"
      - "8453:443"
